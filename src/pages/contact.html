<section class="page-hero">
  <div class="wrap" style="align-items:start">
    <div>
      <p class="eyebrow rv">Contact</p>
      <h1 class="rv">Contact <em>me.</em></h1>
      <p class="lede rv">For questions about sessions or training, or for event and press opportunities, please reach out here.</p>
      <div class="details rv" style="margin-top:40px;max-width:480px">
        <a href="mailto:Mitch@becomeproject.com.au"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M4 7l8 6 8-6"/></svg><div style="all:unset"><b>Email</b><span>Mitch@becomeproject.com.au</span></div></a>
        <a href="https://calendly.com/mitchgainey/60min"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg><div style="all:unset"><b>Book a session</b><span>Choose a time on Calendly</span></div></a>
        <div><svg viewBox="0 0 24 24" fill="none" stroke-width="1.5" aria-hidden="true"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0112 2.5a7 7 0 017 7C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg><div style="all:unset"><b>Where</b><span>Online, and in person on Harley Street, London</span></div></div>
      </div>
    </div>
    <form class="form rv" id="contact-form" action="{{root}}api/contact" method="post" style="background:var(--paper);border-radius:var(--r-lg);padding:36px;border:1px solid #2a2f260d">
      <div class="row">
        <div><label for="f-first">First name <small>(required)</small></label><input id="f-first" name="first_name" autocomplete="given-name" required></div>
        <div><label for="f-last">Last name <small>(required)</small></label><input id="f-last" name="last_name" autocomplete="family-name" required></div>
      </div>
      <div><label for="f-email">Email <small>(required)</small></label><input id="f-email" name="email" type="email" autocomplete="email" required></div>
      <div><label for="f-phone">Phone</label><input id="f-phone" name="phone" type="tel" autocomplete="tel"></div>
      <div><label for="f-topic">What is it about?</label>
        <select id="f-topic" name="topic"><option>1:1 sessions</option><option>Evidence-Based EFT training</option><option>Focusing training</option><option>Mentoring / supervision</option><option>Events or press</option><option>Something else</option></select></div>
      <div><label for="f-msg">Message <small>(required)</small></label><textarea id="f-msg" name="message" required></textarea></div>
      <div class="hp" aria-hidden="true"><label for="f-web">Leave this empty</label><input id="f-web" name="website" tabindex="-1" autocomplete="off"></div>
      <div class="form-status" role="status" aria-live="polite"></div>
      <div><button class="btn solid" type="submit">Send message</button></div>
    </form>
  </div>
</section>
<div style="height:40px"></div>
