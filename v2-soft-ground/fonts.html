<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soft Ground: heading font options</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="fonts.js"></script>
<script>MG_FONTS.forEach(f=>{const l=document.createElement('link');l.rel='stylesheet';l.href=f.css;document.head.appendChild(l)})</script>
<style>
:root{--linen:#f4f0e8;--sage:#b9c2a8;--sage-d:#59644c;--forest:#2f3829;--clay:#c98d6b;--ink:#2a2f26;--muted:#5f665a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#e9e4d9;color:var(--ink);font:300 17px/1.6 "Hanken Grotesk",system-ui,sans-serif;padding:48px 32px 120px}
.top{max-width:1320px;margin:0 auto 36px;display:flex;justify-content:space-between;align-items:end;gap:24px;flex-wrap:wrap}
.top h1{font:500 32px/1.1 "Hanken Grotesk";letter-spacing:-.02em}
.top p{color:var(--muted);max-width:620px;margin-top:8px}
.top a{color:var(--ink);font-weight:500}
.ctl{display:flex;gap:8px;flex-wrap:wrap}
.ctl button{font:500 14px "Hanken Grotesk";border:1px solid #2a2f2633;background:#fff;border-radius:999px;padding:9px 16px;cursor:pointer}
.ctl button[aria-pressed=true]{background:var(--forest);color:var(--linen);border-color:var(--forest)}
.grid{max-width:1320px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));gap:20px}
.card{background:var(--linen);border-radius:28px;padding:30px 30px 26px;display:flex;flex-direction:column;border:1px solid #2a2f260d;transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-3px);box-shadow:0 24px 50px -30px #2f382980}
.card.dark{background:var(--forest);color:var(--linen)}
.meta{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:22px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;color:var(--sage-d)}
.dark .meta{color:var(--sage)}
.meta b{font-weight:600}
.d{font-family:var(--f);font-weight:var(--fl);letter-spacing:var(--ls);font-size-adjust:var(--fsa);font-variation-settings:var(--fvs);line-height:1.05}
.d em{font-style:var(--em);color:var(--sage-d)}
.dark .d em{color:var(--clay)}
.h1{font-size:54px;margin-bottom:22px}
.h2{font-size:32px;margin-bottom:18px}
.row{display:flex;align-items:baseline;gap:22px;margin-bottom:6px}
.price{font-size:50px}
.logo{font-weight:var(--fr);font-size:24px}
.quote{font-size:24px;line-height:1.25;font-style:var(--em);margin-top:12px}
.note{font-size:15px;color:var(--muted);margin-top:auto;padding-top:20px;border-top:1px solid #2a2f261a}
.dark .note{color:#c9cfbd;border-color:#f4f0e822}
.card a.try{display:inline-block;margin-top:14px;background:var(--forest);color:var(--linen);text-decoration:none;font-weight:500;font-size:14px;padding:11px 18px;border-radius:999px;align-self:flex-start}
.dark a.try{background:var(--linen);color:var(--forest)}
.cur{background:var(--clay);color:#fff;border-radius:999px;padding:3px 10px;letter-spacing:.08em}
</style>
</head>
<body>
<div class="top">
  <div>
    <h1>Soft Ground: heading font options</h1>
    <p>Each card shows the real hero headline, a section heading, the logo, a price and a testimonial in that font. Body text stays Hanken Grotesk. Click <b>See it on the page</b> to load the full homepage in that font. <a href="./">← Back to Soft Ground</a></p>
  </div>
  <div class="ctl" role="group" aria-label="Background"><button aria-pressed="true" data-bg="light">Light</button><button aria-pressed="false" data-bg="dark">Dark</button></div>
</div>
<div class="grid" id="grid"></div>
<script>
const g=document.getElementById('grid');
MG_FONTS.forEach(f=>{
  const c=document.createElement('article');c.className='card';
  c.style.cssText=`--f:${f.family};--fl:${f.light};--fr:${f.reg};--ls:${f.ls};--fsa:${f.fsa};--fvs:${f.fvs||'normal'};--em:${f.italic?'italic':'normal'}`;
  c.innerHTML=`<div class="meta"><b>${f.name}</b>${f.key==='cormorant'?'<span class="cur">Current</span>':`<span>${f.source}</span>`}</div>
  <div class="d h1">Some things are still <em>living in the body.</em></div>
  <div class="d h2">Three ways in, depending on where you are.</div>
  <div class="row"><span class="d logo">Mitch Gainey</span><span class="d price">£80</span></div>
  <div class="d quote">“The work felt deeper than usual, and genuinely powerful.”</div>
  <p class="note">${f.note}</p>
  <a class="try" href="./?font=${f.key}">See it on the page →</a>`;
  g.appendChild(c);
});
document.querySelectorAll('.ctl button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.ctl button').forEach(x=>x.setAttribute('aria-pressed',x===b));
  document.querySelectorAll('.card').forEach(c=>c.classList.toggle('dark',b.dataset.bg==='dark'));
});
</script>
</body>
</html>
